<div id="voice-container">
    <div id="controls-row">
        <button id="mic-btn" class="mic-button" title="Click to start/stop recording">
            <svg id="mic-icon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
        <span id="status-text">Click mic to start recording</span>
    </div>
    <div id="transcript-preview"></div>
    <div id="unsupported-msg" style="display:none; color:#cc3300; font-size:0.85em; margin-top:4px;">
        Speech recognition is not supported in this browser. Please use Chrome or Edge, or type your response below.
    </div>
</div>
